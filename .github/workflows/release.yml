name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: ${{ vars.NPM_RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.7
      - run: bun install --frozen-lockfile
      - id: release
        name: Inspect release candidate
        run: bun run scripts/inspect-release.ts
      - name: Run complete release gate
        run: bun run test:release
      - name: Pack release assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: bun run scripts/build-release-artifacts.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-${{ steps.release.outputs.version }}-release-evidence
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: ${{ needs.prepare.outputs.published != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: work-${{ needs.prepare.outputs.version }}-release-evidence
          path: dist/
      - name: Verify downloaded archive
        run: cd dist && sha256sum --check "work-${RELEASE_VERSION}.tgz.sha256"
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Ensure immutable tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "${tag}"
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --draft \
              --verify-tag \
              --title "Work ${RELEASE_VERSION}" \
              --notes "Beta release. See CHANGELOG.md and the attached provenance artifacts."
          fi
          gh release upload "${tag}" --clobber \
            "dist/work-${RELEASE_VERSION}.tgz" \
            "dist/work-${RELEASE_VERSION}.tgz.sha256" \
            "dist/work-${RELEASE_VERSION}.cdx.json"
      - name: Publish exact tarball with npm OIDC
        if: ${{ needs.prepare.outputs.published != 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish "./dist/work-${RELEASE_VERSION}.tgz" --access public --tag latest
      - name: Wait for registry verification data
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if npm view "@good-work/work@${RELEASE_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Published package did not become readable within 60 seconds." >&2
          exit 1
      - name: Verify registry signatures and attestations
        env:
          NPM_AUDIT_SIGNATURES_PATH: ${{ runner.temp }}/npm-audit-signatures.json
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          audit_dir="$(mktemp -d)"
          cd "$audit_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --registry=https://registry.npmjs.org "@good-work/work@${RELEASE_VERSION}"
          npm audit signatures --json --include-attestations --registry=https://registry.npmjs.org > "$NPM_AUDIT_SIGNATURES_PATH"
      - name: Verify public npm and source provenance
        env:
          NPM_AUDIT_SIGNATURES_PATH: ${{ runner.temp }}/npm-audit-signatures.json
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-public-release.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if test "$(gh release view "v${RELEASE_VERSION}" --json isDraft --jq .isDraft)" = "true"; then
            gh release edit "v${RELEASE_VERSION}" --draft=false --latest
          fi
