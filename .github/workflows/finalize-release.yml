name: Finalize release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm version already approved from staging
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: npm-finalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: npm-stage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - name: Verify registry signatures and attestations
        env:
          NPM_AUDIT_SIGNATURES_PATH: ${{ runner.temp }}/npm-audit-signatures.json
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          audit_dir="$(mktemp -d)"
          cd "$audit_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --registry=https://registry.npmjs.org "@good-work/work@${RELEASE_VERSION}"
          npm audit signatures --json --include-attestations --registry=https://registry.npmjs.org > "$NPM_AUDIT_SIGNATURES_PATH"
      - name: Verify public npm and source provenance
        env:
          NPM_AUDIT_SIGNATURES_PATH: ${{ runner.temp }}/npm-audit-signatures.json
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-public-release.mjs
      - name: Publish existing draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v${RELEASE_VERSION}" --draft=false --latest
